# This will be merged into the inherited config from the base run

base_run: TN-tide-noleak # remediation reeval: crashed before rollout eval, same histogram hang already fixed for IS/IN/UF/CF
prefer_model_alias: best # null just takes the one with latest, can be best or latest.

test_cache_name: ${ run_name } #test_tinyhistory # test_cache_unflow #  # tinyhistory_seq_normal_smC_BIG #
test_cache_mode: create # create or use

# Autoregressive rollout evaluation after trainer.test. Base runs predate this
# feature, so it only runs when this block is present here. Comment out to disable.
rollout:
  start_fractions: [0.05, 0.10, 0.25, 0.50, 0.75] # rollout start points as fraction of shot length
  step: ${ data.seq_length } # samples to advance per generation; < seq_length gives overlapped chaining
  # Full test set (44 shots) x 5 fractions x 30 samples = 6600 rollouts, for good
  # per-(start_fraction, depth) sample sizes in the horizon analysis. Sized against the
  # planning-time estimate of 10-25 min for 220 rollouts (n_samples=1): 30x that is
  # ~5-12.5h, which is why run_snellius_job.sh's SBATCH --time was raised to 1400:00
  # (23.3h) to cover the pessimistic end with margin. That 10-25 min baseline was never
  # actually measured on GPU though, so time a short run first (e.g. n_samples=2 on the
  # full shot set) and rescale linearly before trusting either number on the cluster.
  # Labeling does not scale with n_samples (batched per (shot,start_i) in
  # src.rollout.label_rollout_group), so generation is the only real driver of wall time.
  # If the run still exceeds budget, generation/caching has already succeeded regardless
  # (the browser and the summary are written before the horizon analysis, and each of
  # the three is isolated so one failing doesn't take out the others); analysis_max_samples
  # below is the lever if the horizon analysis specifically runs out of memory.
  n_samples: 30 # remediation batch
  n_steps: ${ evaluation.n_steps }
  max_batch: 128 # rollouts advance in lockstep; batches shrink as rollouts finish
  clamp_history: false # clamp fed-back generated history to [0,1]
  cache_name: ${ test_cache_name }_rollout
  cache_mode: create # create or use (use: read cache, skip generation)
  # 5 window_set shots spanning distinct regimes: 57013/77604 general paper picks,
  # 61237 has big ELM peaks at 75%, 64770 alone covers L/H/ELM-chaos across its own
  # start fractions, 73368 is the calm/boring baseline for contrast. The cache itself
  # holds all 44 shots; this only limits what the interactive browser renders.
  html_shots: [57013, 61237, 64770, 73368, 77604]
  plot_samples: 4 # stochastic samples overlaid per starting point in the browser (see todo.md)
  analysis: true # also export the horizon figures/tables in-run (redo/tweak later via eval_notebooks/rollout_analysis.py)
  # analysis_max_samples: null # cap samples/start point fed into the horizon stats (like
  # plot_samples but for the analysis, not the browser); only set this if a full run has
  # actually run out of memory, since it trades away the statistical power n_samples buys.

batch_size: 512
data:
  batch_size: 512

evaluation:
  n_steps: 120 # enough for rk4
  flow_rho: 2.0
  solve_method: simple # dopri5, euler, midpoint
  # Peak histogram PDF export has hung for 11+ hours on the shared reservation node with
  # no progress logged, eating the whole job budget before the rollout stage (the actual
  # point of a reeval) ever starts. Skip it here; redo later from the test cache if needed.
  skip_peak_histograms: true
  plot_functions:
  # every item has to have a 'key' key.
  # n are optional through defaults in PlotsCallback
  # all other keys are passed as kwargs to the plot function
  # - key: 2d_flow_plot
  # #   n: 64
  - key: animated_traces
    n: 5
  - key: multi_channel_lines
    n: 16
    buttons: true
  # Prominence histograms
  # - key: histogram  # see histograms.py
  #   log_key: peak_histogram/dml_energy_delta
  #   channel_name: DML
  #   measure: energy_delta
  #   n: 64



window_set:
  - [57013, 0.94]
  - [57013, 1.08]
  - [73368, 0.38] # All low and boring
  - [77604, 0.72]
  - [77604, 0.77]
  - [77409, 1.32]
  - [69514, 0.51]
  - [69514, 0.51]
  - [64770, 0.17] # L Mode boringness
  - [64770, 1.09] # H Mode boringness, middenhoog NBI
  - [64770, 1.52] # H mode shit gets loose
  - [61237, 0.89] # 75% BIG peaks
  - [61028, 0.98] # 75%
  - [61028, 1.12] # 78%
  - [60813, 1.00] # NBI ramping up
  - [60813, 1.42] # ramped up to 75%
  - [77595, 0.94] # High NBI
  - [76702, 1.14] # high NBI
