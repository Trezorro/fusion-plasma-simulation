# main config for the plasma flow paper that followed from the thesis
features:
  - manual_optimization
  - batch_rematching
  - pass_t_to_conditioning_input #  Makes sure flow t is also available in the conditioning input when sequentially conditioning
  - learning_rate_schedule
  - true_condition_concat
  - speed_monitor
  - FIX_conditioning_input_matching
  - learning_rate_scheduler
  # - resume_run
# run_name: testrunAAA
# resume_id: fwxfmft7
# resume_name: seq_normal_smC_BIG2

epochs: 120
limit_train_batches: 150
limit_val_batches: 30
batch_size: 128
patience: 20
gradient_clip_val: 10 # in testing, lower values did not help prevent loss explosions. This is just a safeguard
skip_log_summary: false

test_cache_name: ${ run_name }
test_cache_mode: create # create or use

window_set: # for evaluation plots
  - [57013, 0.94]
  - [57013, 1.08]
  - [73368, 0.38] # All low and boring
  - [77604, 0.72]
  - [77604, 0.77]
  - [77409, 1.32]
  - [69514, 0.51]
  - [69514, 0.51]
  - [64770, 0.17] # L Mode boringness
  - [64770, 1.09] # H Mode boringness, middenhoog NBI
  - [64770, 1.52] # H mode shit gets loose
  - [61237, 0.89] # 75% BIG peaks
  - [61028, 0.98] # 75%
  - [61028, 1.12] # 78%
  - [60813, 1.00] # NBI ramping up
  - [60813, 1.42] # ramped up to 75%
  - [77595, 0.94] # High NBI
  - [76702, 1.14] # high NBI

evaluation:
  n_steps: 100 # enough for rk4
  flow_rho: 3.0 # must be between 1.0 and 3.0
  solve_method: simple # dopri5, euler, midpoint
  max_n: 64
  val_every_n_epochs: 5
  train_every_n_epochs: 20
  scrutinize_epochs: 3 # Epochs equal or lower than this will always be fully evaluated. -1 to disable
  plot_functions:
    # every item has to have a 'key' key.
    # n are optional through defaults in PlotsCallback
    # all other keys are passed as kwargs to the plot function
    # - key: 2d_flow_plot
    #   n: 64
    - key: animated_traces
      n: 5
    - key: multi_channel_lines
      n: 16
      buttons: true
    - key: histogram # see histograms.py
      log_key: peak_histogram/PD_count
      channel_name: PD
      measure: count
      n: 64
    - key: entropy_plot
      method: app_entropy
      log_key: approximate_entropy_plot
      n: 64
    - key: entropy_plot
      method: spectral_entropy
      log_key: spectral_entropy_plot
      n: 64
    # - key: entropy_plot
    #   method: perm_entropy
    #   log_key: permutation_entropy_plot
    #   n: 64

# model: model.yaml # To be replaced by respective yaml file content
# model: configs/unflow.yaml

model:
  Class: FlowModule
  params:
    prior: "normal" # normal, copy, brownian, levy, resample, constant
    # prior_sigma: std of the prior (source) distribution in the normalized [0,1] space.
    # Meaning is per-prior: normal -> constant per-step std; brownian -> terminal std
    # (its time-averaged std is prior_sigma/sqrt(2)). At 0.3 every prior lands in the
    # 0.2-0.3 band that spans the normalized data range, so one default serves all priors:
    # normal keeps ~90% of mass in [0,1], brownian gets terminal std 0.30 / avg 0.21.
    prior_sigma: 0.3
    ot_method: null # null to disable
    ot_replace: true # Default false
    batch_rematch_factor: 10 # Default 1
    step_every_nth_match: 1 # Default 1 # TODO
    gradient_clip_val: ${ gradient_clip_val }
    solve_method: ${ evaluation.solve_method }
    flow_steps: ${ evaluation.n_steps }
    flow_rho: ${ evaluation.flow_rho }
    model: ConditionalUNet # Must accept x, t inputs
    model_params:
      conditioning: ["x_history", "c"] # TODO will affect architecture
      conditioning_method: sequence # sequence, channels, mid-sequence, mid-channels
      spatial_dim: 1  # always 1 for time series, may be 2 for 2d convolutions in u-net
      input_channels: 5 # Default 3
      c_channels:  # Default 0 disables conditioning on C
      apex_hidden_channels: 64 # Default 128
      # activation: GELU  # Default GELU # TODO implement configurable activation
      time_embedding: sinusoidal+mlp # default: sinusoidal, with optional +mlp, other: dummy
      time_embedding_d: 32 # Default 32
      positional_encoding: null # sinusoidal+mlp # Default sinusoidal, other: sinusoidal+mlp, dummy
      positional_encoding_d: 32
      positional_encoding_c: 8 # Only used if using +mlp
      ch_mults: [2, 2, 2, 2] # Default [1, 2, 2, 4]
      is_attn: [false, false, false, false] # Default [false, false, false, false]
      mid_attn: true # Default false
      attn_heads: 2 # Default 1
      n_blocks: 2 # Default 2. Number of residual blocks
      norm_groups: 4 # Default false
      use1x1: false # Default false
    loss: MSELoss
    optimizer_params:
      lr: 0.00005
      weight_decay: 0 # Default 0
      amsgrad: false # Default false

data:
  Class: FusionShotDataModule
  dir: ./data/
  file: 2026_06_29-TCV_shots_V2.parquet
  batch_size: ${ batch_size }
  seq_length: 256
  history_length: ${ data.seq_length } # default null / 0, if positive int, will include x_history in the conditioning_inputs
  crop_margin: 384 # Determines the unused period at start and end of each shot for preprocessing. Must be larger than seq_length
  overfit_on_shots: null # list of ints or null
  allowed_start_indices: null # list of ints or null
  sample_rate: 10000
  pre_shuffle: true
  cols:
    meta:
      - ShotNum
      - time
    x: [
        "FIR_LIDs_core", # replaces FIR_core
        # "Halpha1",        # replaces PD (H-alpha divertor photodiode)
        "PD", # renamed H alpha 1 column back to PD for explicit compatibility
        "DML", # same
        "POHM", # same
        "Z_axis", # same
