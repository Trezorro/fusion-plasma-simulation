# main config for the plasma flow paper that followed from the thesis
features:
  - manual_optimization
  - batch_rematching
  - pass_t_to_conditioning_input #  Makes sure flow t is also available in the conditioning input when sequentially conditioning
  - learning_rate_schedule
  - true_condition_concat
  - speed_monitor
  - FIX_conditioning_input_matching
  - learning_rate_scheduler
  # - resume_run
# run_name: testrunAAA
# resume_id: fwxfmft7
# resume_name: seq_normal_smC_BIG2

epochs: 120
limit_train_batches: 150
limit_val_batches: 30
batch_size: 128
patience: 20
gradient_clip_val: 10 # in testing, lower values did not help prevent loss explosions. This is just a safeguard
skip_log_summary: false

test_cache_name: ${ run_name }
test_cache_mode: create # create or use

# Autoregressive rollout evaluation after trainer.test. Remove/comment this whole
# block to turn the feature off; nothing else references it.
rollout:
  start_fractions: [0.05, 0.10, 0.25, 0.50, 0.75] # rollout start points as fraction of shot length
  step: ${ data.seq_length } # samples to advance per generation; < seq_length gives overlapped chaining
  n_samples: 30 # stochastic samples per start point; this block fires after every training
  # run (run.py gates on 'rollout' in C, nothing else), so this cost is paid every time.
  n_steps: ${ evaluation.n_steps }
  max_batch: 128 # rollouts advance in lockstep; batches shrink as rollouts finish
  clamp_history: false # clamp fed-back generated history to [0,1]
  cache_name: ${ test_cache_name }_rollout
  cache_mode: create # create or use (use: read cache, skip generation)
  # 5 window_set shots spanning distinct regimes: 57013/77604 general paper picks,
  # 61237 has big ELM peaks at 75%, 64770 alone covers L/H/ELM-chaos across its own
  # start fractions, 73368 is the calm/boring baseline for contrast.
  html_shots: [57013, 61237, 64770, 73368, 77604]
  plot_samples: 3 # stochastic samples overlaid per starting point in the browser (see todo.md)
  analysis: true # also export the horizon figures/tables in-run (redo/tweak later via eval_notebooks/rollout_analysis.py)
  # analysis_max_samples: null # cap samples/start point fed into the horizon stats (like
  # plot_samples but for the analysis, not the browser); only set this if a full run has
  # actually run out of memory, since it trades away the statistical power n_samples buys.

# MARK:
window_set: # for evaluation plots
  - [57013, 0.94]
  - [57013, 1.08]
  - [73368, 0.38] # All low and boring
  - [77604, 0.72]
  - [77604, 0.77]
  - [77409, 1.32]
  - [69514, 0.51]
  - [69514, 0.51]
  - [64770, 0.17] # L Mode boringness
  - [64770, 1.09] # H Mode boringness, middenhoog NBI
  - [64770, 1.52] # H mode shit gets loose
  - [61237, 0.89] # 75% BIG peaks
  - [61028, 0.98] # 75%
  - [61028, 1.12] # 78%
  - [60813, 1.00] # NBI ramping up
  - [60813, 1.42] # ramped up to 75%
  - [77595, 0.94] # High NBI
  - [76702, 1.14] # high NBI

# MARK:
evaluation:
  n_steps: 100 # enough for rk4
  flow_rho: 2.0 # must be between 1.0 and 3.0
  solve_method: simple # dopri5, euler, midpoint
  max_n: 64
  # Peak histogram PDF export has hung for 11+ hours on the shared reservation node with
  # no progress logged, eating the whole job budget before the rollout stage ever starts.
  # Off for the grid so every cell reliably reaches rollout; redo later from the test
  # cache (mode=use) once the grid is through, when node contention is less of a risk.
  skip_peak_histograms: true
  peaks:
    # scipy.signal.find_peaks prominence on the [0,1]-normalized signal, for every channel.
    # Deliberately at noise level: PD and FIR hold tens to hundreds of peaks per window at this value.
    prominence: 0.001
    # What counts as an ELM-scale H-alpha (PD) burst. Used in two places, and it must be the same
    # number in both: the 'PD large peaks' channel, and the coincidence gate that defines the
    # 'DML ELM peaks' channel. Was historically split (0.1 for the former, 0.15 for the latter);
    # unified here. See docs/evaluation-metrics.md.
    elm_pd_prominence: 0.1
  val_every_n_epochs: 5
  train_every_n_epochs: 20
  scrutinize_epochs: 3 # Epochs equal or lower than this will always be fully evaluated. -1 to disable
  plot_functions:
    # every item has to have a 'key' key.
    # n are optional through defaults in PlotsCallback
    # all other keys are passed as kwargs to the plot function
    # - key: 2d_flow_plot
    #   n: 64
    - key: animated_traces
      n: 5
    - key: multi_channel_lines
      n: 16
      buttons: true
    # - key: entropy_plot
    #   method: perm_entropy
    #   log_key: permutation_entropy_plot
    #   n: 64

# MARK:
model: configs/unflow.yaml # grid cell UFv2-unet-triple; or configs/{cfm,unflow,itransformer,tide,dlinear,patchtst}.yaml
# MARK:
