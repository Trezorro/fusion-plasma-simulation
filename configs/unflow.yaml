limit_train_batches: 100
limit_val_batches: 20
patience: 20

model: 
  Class: UnFlowModule
  params:
    prior: 'constant'  # normal, copy, brownian, levy, resample, constant
    prior_sigma: 0.3 # Default 0.3, which gets about 90% of the values between the normalized 0 and 1 range
    ot_method: null  # null to disable
    ot_replace: true  # Default false
    batch_rematch_factor: 1  # Default 1
    step_every_nth_match: 1  # Default 1 # TODO
    gradient_clip_val: ${ gradient_clip_val }
    solve_method: ${ evaluation.solve_method }
    flow_steps: ${ evaluation.n_steps }
    flow_rho: ${ evaluation.flow_rho }
    model: ConditionalUNet  # Must accept x, t inputs
    model_params:
      conditioning: ['x_history', 'c']
      conditioning_method: sequence # sequence, channels, mid-sequence, mid-channels
      spatial_dim: 1
      input_channels: 5 # Default 3
      c_channels: 0  # Default 0 disables conditioning on C
      apex_hidden_channels: 64  # Default 128
      # activation: GELU  # Default GELU # TODO implement configurable activation
      time_embedding: sinusoidal  # default: sinusoidal, with optional +mlp, other: dummy
      time_embedding_d: 4  # Default 32 
      positional_encoding: null  # Default sinusoidal, other: sinusoidal+mlp, dummy
      positional_encoding_d: 0
      positional_encoding_c: 0  # Only used if using +mlp
      ch_mults: [2, 2, 2, 2]  # Default [1, 2, 2, 4]
      is_attn: [false, false, false, false] # Default [false, false, false, false]
      mid_attn: false # Default false. UN/US/UF: true (attention on). USb: false (attention off, final-work variant)
      attn_heads: 2  # Default 1
      n_blocks: 2 # Default 2. Number of residual blocks
      norm_groups: 4 # Default false
      use1x1: false # Default false
    loss: MSELoss
    optimizer_params:
      lr: 0.00005
      weight_decay: 0  # Default 0
      amsgrad: false  # Default false



