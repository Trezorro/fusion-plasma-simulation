features:
  - manual_optimization
  - batch_rematching
  - pass_t_to_conditioning_input  #  Makes sure flow t is also available in the conditioning input when sequentially conditioning
  - learning_rate_schedule
  - true_condition_concat
  - speed_monitor
  - FIX_conditioning_input_matching

epochs: 8000
batch_size: 82
patience: 400
gradient_clip_val: 10  # in testing, lower values did not help prevent loss explosions. This is just a safeguard
skip_log_summary: false
evaluation:
  n_steps: 150
  max_n: 64
  val_every_n_epochs: 20
  train_every_n_epochs: 40
  scrutinize_epochs: 10  # Epochs equal or lower than this will always be fully evaluated. -1 to disable
  plot_functions:
    # every item has to have a 'key' key.
    # n are optional through defaults in PlotsCallback
    # all other keys are passed as kwargs to the plot function
    - key: 2d_flow_plot
      n: 64
    - key: line_flow_plot
      n: 5
    - key: multi_channel_lines
      n: 5
      buttons: true


# model: model.yaml # To be replaced by respective yaml file content
# hidden_features: int = 128,
#         activation: nn.Module = nn.GELU(),
#         norm: bool = False,
#         ch_mults=(2, 2, 2, 2),
#         is_attn=(False, False, False, False),
#         mid_attn: bool = False,
#         n_blocks: int = 2,
#         use1x1: bool = False,
model: 
  Class: FlowModule
  params:
    prior: 'brownian'  # normal, copy, brownian
    ot_method: null  # null to disable
    ot_replace: true  # Default false
    batch_rematch_factor: 64  # Default 1
    step_every_nth_match: 1  # Default 1 # TODO
    gradient_clip_val: ${ gradient_clip_val }
    model: ConditionalUNet  # Must accept x, t inputs
    model_params:
      conditioning: ['x_history'] # TODO will affect architecture
      conditioning_method: sequence # sequence, channels, mid-sequence, mid-channels
      spatial_dim: 1
      input_channels: 5 # Default 3
      apex_hidden_channels: 64  # Default 128
      # activation: GELU  # Default GELU # TODO implement configurable activation
      time_embedding: sinusoidal+mlp  # default: sinusoidal, with optional +mlp, other: dummy
      time_embedding_d: 8  # Default 32 
      positional_encoding: sinusoidal+mlp  # Default sinusoidal, other: sinusoidal+mlp, dummy
      positional_encoding_d: 32
      positional_encoding_c: 4  # Only used if using +mlp
      ch_mults: [2, 2, 2, 2]  # Default [1, 2, 2, 4]
      is_attn: [true, false, false, false] # Default [false, false, false, false]
      mid_attn: true # Default false
      attn_heads: 4  # Default 1
      n_blocks: 2 # Default 2. Number of residual blocks
      norm_groups: 4 # Default false
      use1x1: false # Default false
    loss: MSELoss
    optimizer_params:
      lr: 0.0001
      weight_decay: 0  # Default 0
      amsgrad: false  # Default false

# Shorthands for important parameters for wandb
Prior: ${ model.params.prior }
Ot_method: ${ model.params.ot_method }
Cond_dim: ${ model.params.model_params.conditioning_method }
Channels: ${ model.params.model_params.input_channels }
Apex_channels: ${ model.params.model_params.apex_hidden_channels }
T_embedding: ${ model.params.model_params.time_embedding }
T_emb_d: ${ model.params.model_params.time_embedding_d }
Pos_encoding: ${ model.params.model_params.positional_encoding }
Pos_enc_d: ${ model.params.model_params.positional_encoding_d }
Pos_enc_c: ${ model.params.model_params.positional_encoding_c }
Attn: ${ model.params.model_params.is_attn }
Mid_attn: ${ model.params.model_params.mid_attn }
Attn_heads: ${ model.params.model_params.attn_heads }
Norm_groups: ${ model.params.model_params.norm_groups }
Seq_L: ${ data.seq_length }
Crop: ${ data.crop_margin }
Cols: ${ data.cols.x }
Learning_rate: ${ model.params.optimizer_params.lr }
Rematches: ${ model.params.batch_rematch_factor }

data:
  Class: ShotFlowDS
  dir: ./data/
  file: 2024_05_01-NaNsFiltered.parquet
  seq_length: 256
  history_length: ${ data.seq_length } # default null / 0, if positive int, will include x_history in the conditioning_inputs
  crop_margin: 2000  # Determines the unused period at start and end of each shot for preprocessing
  force_start: false
  random_start: true
  force_fixed_shot: null # int if you want to overfit on one data point or null
  overfit_on_shots: null  # list of ints or null
  force_mean_zero: false  # may cause division by zero
  time_last: true  # Sets the time dim as the last dim
  sample_rate: 10000
  cols:
    meta:
    - ShotNum
    - time
    x: [
            # "FIR",  # density lijn Interferometer (not in my dataset)
            "FIR_core",  # For the March dataset of 260 shots, the FIR_core signal is the same as FIR.
            "PD",  # photodiode lijn op de divertor
            "DML",  # Magnetische respons  correleert met de energie in het plasma
            "POHM",  # Gemeten power waarde meet de power die uit wrijving komt
            "Z_axis",  # center Plasma positie in de verticale lijn. deviation van reference is betekenis.
        ]
