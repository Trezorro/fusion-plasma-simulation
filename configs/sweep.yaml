program: run.py
name: LearningRateStabilitySweep
method: random
metric:
  goal: minimize
  name: loss/val
parameters:
  model.params.optimizer_params.lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.1
  batch_size:
    values: [16, 32, 64, 96, 128]
  gradient_clip_val: 
    values: [1000, 100, 10, 1, 0.5, 0.1]
  data.seq_length:
    values: [128, 256, 512, 1024]

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}

## Start with `wandb sweep configs/sweep.yaml`