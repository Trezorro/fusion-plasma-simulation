model:
  Class: EncoderDecoder
  description: Encoder-Decoder model with CNN, LSTM, LSTM layers
  future_work: Autoregressively feed output in decoder
  params:
    warmup_input_size: 12
    conditional_input_size: 7
    output_size: 5
    hidden_cnn_channels: 64
    rnn_input_channels: 64
    hidden_state_size: 64
    decoder_rnn_type: LSTM
    num_layers: 4
    dropout: 0.1
    forecast_horizon: ${ forecast_horizon }
    loss: ${ loss }