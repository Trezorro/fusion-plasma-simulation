limit_train_batches: 100
limit_val_batches: 20
patience: 20

# Deterministic baseline: TiDE (Das et al., 2023). Covariate-aware via its temporal decoder.
# Control covariates in data.cols.c ride through TiDE's "mark" slot over the full
# [history|horizon] window; the temporal decoder feeds their FUTURE values to the aligned
# horizon step. The timing-oracle experiment is run by choosing which covariates go in
# data.cols.c (e.g. adding timing-bearing signals). No masking flag; C is always fed in full.
# Native lookback/horizon convention: seq_len = history (NOT history+horizon like iTransformer).
# Select by setting `model: configs/tide.yaml` in configs/plasmaflow.yaml.
model:
  Class: UnFlowModule
  params:
    prior: 'constant'  # deterministic fixed input (ignored by the backbone)
    prior_sigma: 0.3
    ot_method: null
    ot_replace: true
    batch_rematch_factor: 1
    step_every_nth_match: 1
    gradient_clip_val: ${ gradient_clip_val }
    solve_method: ${ evaluation.solve_method }
    flow_steps: ${ evaluation.n_steps }
    model: TiDE  # backbone selected from FlowModule.MODEL_OPTIONS
    model_params:
      input_channels: 5  # auto-synced from len(data.cols.x) by config.update_model_input_channels
      c_channels: 3      # auto-synced from len(data.cols.c); sets the mark (covariate) width
      seq_len: 256   # lookback = data.history_length (NOT history+horizon)
      pred_len: 256  # horizon = data.seq_length
      use_norm: false  # disable TiDE inline instance-norm (it fights the linear residual; comparability)
      d_model: 256   # MLP hidden / residual-block width
      d_ff: 256      # temporal-decoder hidden width
      e_layers: 2
      d_layers: 2
      dropout: 0.1
      freq: h        # fallback mark width only when c_channels == 0
      # conditioning documents what the adapter reads from conditioning_input (x_history AND c;
      # covariate-aware). It does NOT gate the data: x_history/c are provided whenever
      # data.history_length > 0 / data.cols.c is non-empty. positional_encoding: null keeps
      # _validate_configuration happy (position_sequence not used).
      conditioning_method: sequence
      conditioning: ["x_history", "c"]
      positional_encoding: null
      # for tracking references
      apex_hidden_channels: null
      time_embedding: null
      time_embedding_d: null
      positional_encoding_d: null
      positional_encoding_c: null
      is_attn: null
      mid_attn: null
      attn_heads: null
      norm_groups: null
    loss: MSELoss
    optimizer_params:
      lr: 0.00005
      weight_decay: 0
      amsgrad: false
