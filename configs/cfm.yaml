# Conditional Flow Matching (CFM), the paper's own model. This file holds the axes that
# vary across the CN/CNb/CNc/CNd/CF grid cells (prior, prior_sigma, model_params.mid_attn);
# everything else here is the fixed architecture. See docs/run_grid.md for what each cell
# changes and why. Select by setting `model: configs/cfm.yaml` in configs/plasmaflow.yaml.
model:
  Class: FlowModule
  params:
    prior: "normal" # normal, brownian for this grid; see docs/run_grid.md
    # prior_sigma: std of the prior (source) distribution in the normalized [0,1] space.
    # Meaning is per-prior: normal -> constant per-step std; brownian -> terminal std
    # (its time-averaged std is prior_sigma/sqrt(2)). 0.5 (normal) / 0.7 (brownian) are
    # matched so both priors have the same ~0.5 time-averaged spread; see docs/run_grid.md.
    prior_sigma: 0.5
    ot_method: null # null to disable
    ot_replace: true # Default false
    batch_rematch_factor: 10 # Default 1
    step_every_nth_match: 1 # Default 1
    gradient_clip_val: ${ gradient_clip_val }
    solve_method: ${ evaluation.solve_method }
    flow_steps: ${ evaluation.n_steps }
    flow_rho: ${ evaluation.flow_rho }
    model: ConditionalUNet # Must accept x, t inputs
    model_params:
      conditioning: ["x_history", "c"]
      conditioning_method: sequence # sequence, channels, mid-sequence, mid-channels
      spatial_dim: 1 # always 1 for time series
      input_channels: 5 # auto-synced from len(data.cols.x) by config.update_model_input_channels
      c_channels: # auto-synced from len(data.cols.c)
      apex_hidden_channels: 64
      time_embedding: sinusoidal+mlp
      time_embedding_d: 32
      positional_encoding: null # removed for the paper to prevent shortcut learning
      positional_encoding_d: 32
      positional_encoding_c: 8
      ch_mults: [2, 2, 2, 2]
      is_attn: [false, false, false, false] # attention stays bottleneck-only either way
      mid_attn: false # CN/CNc/CF: true (attention on). CNb/CNd: false (attention off)
      attn_heads: 2
      n_blocks: 2
      norm_groups: 4
      use1x1: false
    loss: MSELoss
    optimizer_params:
      lr: 0.00005
      weight_decay: 0
      amsgrad: false
